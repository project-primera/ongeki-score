; アプリケーション固有の PHP 設定（php.ini-production の上書き）
expose_php = Off
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000
date.timezone = Asia/Tokyo

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000

; session.upload_progress は LFI と組み合わせた既知の攻撃手法に使われるため無効化する（Laravel は PHP のセッションを使わないので影響なし）
session.upload_progress.enabled = 0
