; アプリケーション固有の PHP 設定（php.ini-production の上書き）
expose_php = Off
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000
date.timezone = Asia/Tokyo

; 例外トレースに引数を残さない（php.ini-production と同じ）。Off と fatal_error_backtraces = On の組み合わせは
; CVE-2026-129474 の成立条件になるので、Off にしない。
; 下の string_param_max_len は、この項目を Off にしたときだけ効く
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 15

; 致命的エラーのバックトレースを出さない（PHP 8.5 の既定は On）。CVE-2026-129474 / CVE-2026-129182 の暫定回避。
; 修正の入った PHP 8.5.13 を適用した後に On へ戻すかどうかは、オーナーが判断する
fatal_error_backtraces = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000

; session.upload_progress は LFI と組み合わせた既知の攻撃手法に使われるため無効化する（Laravel は PHP のセッションを使わないので影響なし）
session.upload_progress.enabled = 0
