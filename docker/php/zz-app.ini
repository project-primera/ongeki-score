; アプリケーション固有の PHP 設定（php.ini-production の上書き）
expose_php = Off
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000
date.timezone = Asia/Tokyo

; 例外トレースに引数を残す（PHP の既定。php.ini-production は消す設定だが、旧イメージは php.ini を読んでおらず残っていた）。
; Slack に添付するトレースの調査用。PHP 8.2 以降、パスワード等の引数は SensitiveParameter で伏せられる
zend.exception_ignore_args = Off
zend.exception_string_param_max_len = 15

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000

; session.upload_progress は LFI と組み合わせた既知の攻撃手法に使われるため無効化する（Laravel は PHP のセッションを使わないので影響なし）
session.upload_progress.enabled = 0
